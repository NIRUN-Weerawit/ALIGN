<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- Figure 1 preview: Venn diagram of three lineages -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.2" flood-opacity="0.35"/>
    </filter>
    <style>
      .lineage-label { font: bold 13px sans-serif; text-anchor: middle; }
      .prior-work { font: 10px sans-serif; text-anchor: middle; fill: #222; }
      .align-label { font: bold 14px sans-serif; text-anchor: middle; }
      .gap-label { font: 9px italic sans-serif; text-anchor: middle; fill: #999; }
    </style>
  </defs>

  <!-- Three circles (120-degree equilateral layout) -->
  <!-- Auto Manipulation: top-left -->
  <circle cx="170" cy="270" r="135"
          fill="#0072B2" fill-opacity="0.45"
          stroke="#0072B2" stroke-width="1.5"/>
  <text x="80" y="370" class="lineage-label">Autonomous</text>
  <text x="80" y="386" class="lineage-label">Manipulation</text>

  <!-- Shared Autonomy: top-right -->
  <circle cx="310" cy="270" r="135"
          fill="#E69F00" fill-opacity="0.45"
          stroke="#E69F00" stroke-width="1.5"/>
  <text x="400" y="370" class="lineage-label">Shared</text>
  <text x="400" y="386" class="lineage-label">Autonomy</text>

  <!-- Task-Semantic Extraction: top -->
  <circle cx="240" cy="125" r="135"
          fill="#009E73" fill-opacity="0.45"
          stroke="#009E73" stroke-width="1.5"/>
  <text x="240" y="25" class="lineage-label">Task-Semantic</text>
  <text x="240" y="41" class="lineage-label">Extraction</text>

  <!-- ALIGN at center (3-way overlap) -->
  <rect x="195" y="220" width="90" height="42" rx="6" ry="6"
        fill="#F0E442" stroke="#D55E00" stroke-width="2"
        filter="url(#shadow)"/>
  <text x="240" y="240" class="align-label">ALIGN</text>
  <text x="240" y="256" class="align-label">(this work)</text>

  <!-- Prior works in each lineage's exclusive region -->
  <rect x="50" y="240" width="160" height="65" rx="3" ry="3"
        fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="130" y="256" class="prior-work"><tspan font-weight="bold">Diffusion Policy</tspan> (Chi 2023)</text>
  <text x="130" y="272" class="prior-work"><tspan font-weight="bold">MemoryVLA</tspan> (2026)</text>
  <text x="130" y="288" class="prior-work">ACT, RT-2, OpenVLA</text>

  <rect x="270" y="240" width="160" height="65" rx="3" ry="3"
        fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="350" y="256" class="prior-work"><tspan font-weight="bold">Yoneda</tspan> (2023)</text>
  <text x="350" y="272" class="prior-work"><tspan font-weight="bold">Wang &amp; Losey</tspan> (2023)</text>
  <text x="350" y="288" class="prior-work">RT-V3, Assistron (2026)</text>

  <rect x="160" y="95" width="160" height="50" rx="3" ry="3"
        fill="white" fill-opacity="0.85" stroke="none"/>
  <text x="240" y="111" class="prior-work"><tspan font-weight="bold">BERT [CLS]</tspan> (2018)</text>
  <text x="240" y="127" class="prior-work"><tspan font-weight="bold">Perceiver</tspan> (2021)</text>

  <!-- Pairwise intersection gaps (no prior work) -->
  <text x="240" y="218" class="gap-label">(no prior work</text>
  <text x="240" y="230" class="gap-label">in any 2-way overlap)</text>

  <!-- Caption -->
  <text x="240" y="465" font-style="italic" font-size="10" text-anchor="middle">
    ALIGN is the first architecture at the 3-way intersection.
  </text>
  <text x="240" y="478" font-style="italic" font-size="10" text-anchor="middle">
    No prior work occupies even any 2-way overlap.
  </text>
</svg>
